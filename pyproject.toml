[project]
name = "flyneuromod"
version = "0.1.0"
description = "A biologically grounded dopamine neuromodulation layer for whole-brain Drosophila connectome models"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Temur Turayev", email = "temurturayev7822@gmail.com" }]
keywords = ["connectome", "drosophila", "dopamine", "neuromodulation", "computational-neuroscience"]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
brian = ["brian2>=2.7"]

[project.urls]
Repository = "https://github.com/TemurTurayev/fly-neuromod"

[project.scripts]
flyneuromod = "flyneuromod.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyneuromod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that run a full-brain simulation (minutes)",
    "data: tests that require the downloaded connectome files",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
