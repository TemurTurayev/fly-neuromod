<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fly inside a real fruit fly brain (all 139,248 FlyWire neurons and its real wiring) and watch dopamine write a memory.">
<meta property="og:title" content="When Dopamine Arrives">
<meta property="og:description" content="Fly inside a real fruit fly brain and watch dopamine write a memory. 139,248 neurons from FlyWire, a model you can play with.">
<meta name="twitter:card" content="summary">
<meta charset="utf-8">
<meta charset="utf-8">
<title>When Dopamine Arrives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#05070b; --panel:#0c0f14; --panel-2:#12161d; --line:#1b212b; --line-2:#28303d;
  --glass:rgba(8,10,14,.8);
  --text:#e2e6ec; --muted:#8c95a4; --faint:#586274;
  --kc:#57e08a; --da:#ff4fb0; --mbon:#5ab4ff; --focus:#ffb84d; --ip3:#b58cff; --g1:#c8a6ff;
  --display:"Unbounded","Avenir Next","Segoe UI",sans-serif;
  --body:"Onest","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--text);font:15px/1.6 var(--body);margin:0}
a{color:var(--focus)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(24px,3vw,32px);font-weight:700;line-height:1.12}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
p{margin:0;max-width:64ch}
.muted{color:var(--muted)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* ---------- stage ---------- */
.stage{position:relative;height:clamp(680px,95vh,1080px);border-bottom:1px solid var(--line);overflow:hidden;background:#05070b}
.viewport{position:absolute;inset:0}
#brain{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#brain:active{cursor:grabbing}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 62% 45%,transparent 45%,rgba(3,4,7,.55) 100%)}
.left{position:absolute;left:20px;top:20px;bottom:20px;width:360px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.left > *{pointer-events:auto}
.title{display:grid;gap:6px}
.title h1{font-size:clamp(24px,2.5vw,34px);font-weight:700;line-height:1.05}
.title p{font-size:14px;color:#bcc3ce;max-width:40ch;line-height:1.5}
.stage.touring .panel{display:none}
.stage:not(.touring) .tourcard{display:none}

.tourcard{padding:18px 18px 14px;display:grid;gap:10px}
.tourcard .step{font:500 11px var(--mono);letter-spacing:.12em;color:var(--focus)}
.tourcard h2{font-size:19px;line-height:1.25}
.tourcard p{font-size:15px;line-height:1.55;color:#cfd5de}
.bar{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--focus)}
.tour-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tour-nav .skip{margin-left:auto;background:none;border:0;color:var(--muted);font:12px var(--mono);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}

.panel{padding:14px 16px;display:grid;gap:13px;overflow:auto;min-height:0}
.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ro{display:grid;gap:1px}
.ro b{font:600 20px/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ro span{font:10.5px/1.3 var(--mono);color:var(--muted)}
.verdict{display:grid;gap:4px}
.pill{justify-self:start;font:600 11px/1 var(--mono);padding:6px 9px;border-radius:999px;letter-spacing:.06em}
.pill.ltd{background:rgba(90,180,255,.14);color:var(--mbon);border:1px solid rgba(90,180,255,.4)}
.pill.ltp{background:rgba(255,184,77,.14);color:var(--focus);border:1px solid rgba(255,184,77,.4)}
.pill.none{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2)}
.vtxt{font-size:13.5px;color:#cfd5de}
.mission{display:grid;gap:6px}
.status{font-size:13px;color:var(--muted);line-height:1.45}
.status.ok{color:var(--kc)}
.maze{display:grid;gap:4px}
#maze{width:100%;height:150px;display:block;background:#080a0e;border:1px solid var(--line);border-radius:8px}
.maze .cap{font-size:13.5px;color:#dfe4eb;line-height:1.4}
.maze .fine{font:10.5px/1.4 var(--mono);color:var(--faint)}
.readouts.small .ro b{font-size:14px}
.ctl{display:grid;gap:4px}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ctl label,.ctl .lbl{font:600 13.5px/1.3 var(--body)}
.ctl output{font:500 12px var(--mono);color:var(--focus);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line-2);border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:var(--line-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--da);margin-top:-7px;box-shadow:0 0 0 4px rgba(255,79,176,.18)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--da)}
#onset::-webkit-slider-thumb{background:var(--focus);box-shadow:0 0 0 4px rgba(255,184,77,.2)}
#onset::-moz-range-thumb{background:var(--focus)}
.ticks{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 11.5px/1 var(--mono);padding:7px 9px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--text);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ground);border-color:var(--text)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font:500 12px/1 var(--mono);color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:9px 11px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{border-color:var(--focus);color:var(--focus)}
.btn.primary{background:var(--focus);color:#1a1206;border-color:var(--focus);font-weight:600}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,summary:focus-visible,.skip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.views{position:absolute;top:20px;right:20px;display:grid;gap:8px;justify-items:end;max-width:calc(100% - 40px)}
.views .row{justify-content:flex-end}
details.layers{padding:8px 12px;min-width:240px}
details.layers summary{cursor:pointer;font:500 12px var(--mono);color:var(--muted);list-style:none}
details.layers summary::-webkit-details-marker{display:none}
details.layers summary::after{content:" +";color:var(--faint)}
details.layers[open] summary::after{content:" −"}
.chs{display:grid;gap:5px;margin-top:8px}
.ch{position:relative;display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:9px;font:11.5px/1.3 var(--mono);cursor:pointer;user-select:none}
.ch input{position:absolute;opacity:0;pointer-events:none}
.sw{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
.ch input:not(:checked) ~ .sw{background:transparent;box-shadow:none;outline:1px solid currentColor}
.nm{color:var(--text)}
.ch input:not(:checked) ~ .nm{color:var(--faint)}
.ch input:focus-visible ~ .nm{outline:1px dashed var(--focus);outline-offset:2px}
.ct{color:var(--muted)}

.legend3d{position:absolute;right:20px;bottom:166px;padding:10px 12px;display:grid;gap:5px;font:11px/1.4 var(--mono);color:var(--muted);max-width:300px}
.legend3d div{display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:start}
.legend3d i{width:9px;height:9px;border-radius:50%;margin-top:2px;box-shadow:0 0 6px currentColor;background:currentColor}
.legend3d .hint{display:block;color:var(--faint);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.tag3d{position:absolute;left:0;top:0;pointer-events:none;font:500 11.5px/1.35 var(--mono);color:var(--text);background:rgba(8,10,14,.74);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:5px 8px;white-space:nowrap;transition:opacity .4s}
.tag3d::before{content:"";position:absolute;left:-14px;top:50%;width:12px;height:1px;background:rgba(255,255,255,.5)}
.tag3d b{font-weight:500}
.tag3d.live{border-color:rgba(255,79,176,.55)}
.tag3d.live b{color:var(--da)}

.timeline{position:absolute;left:400px;right:20px;bottom:20px;height:130px;padding:6px 8px 4px}
#tl{width:100%;height:100%;display:block;cursor:ew-resize;touch-action:none}
.scroll-cue{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font:10px var(--mono);color:var(--faint);letter-spacing:.1em;pointer-events:none}

/* ---------- below ---------- */
section{padding-block:52px;border-bottom:1px solid var(--line)}
.sec-head{display:grid;gap:10px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fact{padding:18px;display:grid;gap:6px;align-content:start}
.fact b{font:700 clamp(26px,3vw,34px)/1 var(--display)}
.fact span{font-size:14px;color:#c3c9d3}
.traces{padding:10px 8px 6px}
#traces{width:100%;display:block;height:380px}
.pair{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.curve-wrap{padding:14px 10px 4px;overflow-x:auto}
#curve{width:100%;min-width:540px;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:4px 14px 12px;font:12px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:8px}
.cut{position:relative}
#cut{width:100%;display:block;aspect-ratio:600/380;height:auto}
.detectors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.det{padding:18px;display:grid;gap:12px;align-content:start}
.det h3{font-size:17px;font-weight:700;line-height:1.2}
.det svg{width:100%;height:auto;display:block}
.det p{font-size:14px;color:#c3c9d3}
.det .src{font:11px/1.4 var(--mono);color:var(--faint)}
.honest{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.honest ul{margin:0;padding:18px 18px 18px 36px;display:grid;gap:8px;font-size:14px;color:#c3c9d3}
.honest h3{font-size:16px;padding:18px 18px 0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;white-space:nowrap}
.tag.measured{color:var(--kc);background:rgba(87,224,138,.1);border:1px solid rgba(87,224,138,.35)}
.tag.calibrated{color:var(--focus);background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.35)}
.tag.assumed{color:var(--muted);background:var(--panel-2);border:1px solid var(--line-2)}
footer{padding-block:40px 60px;display:grid;gap:10px;font-size:14px;color:var(--muted)}

@media (max-width:1000px){ .pair,.detectors,.story,.honest{grid-template-columns:1fr} }
@media (max-width:900px){
  .stage{height:auto;display:flex;flex-direction:column;gap:12px;padding:16px;overflow:visible}
  .left{display:contents}
  .title{order:1}
  .viewport{order:2;position:relative;inset:auto;height:60vh;min-height:360px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .tourcard{order:3}
  .timeline{order:4;position:relative;left:auto;right:auto;bottom:auto;height:118px}
  .panel{order:5;overflow:visible}
  .views{top:10px;right:10px}
  .legend3d,.scroll-cue{display:none}
}
</style>

<header class="stage touring" id="stage">
  <div class="viewport" id="viewport">
    <canvas id="brain"></canvas>
    <div class="vignette"></div>
    <div id="tags"></div>
    <div class="views">
      <div class="row" role="group" id="viewbtns">
        <button class="btn" type="button" data-view="brain" data-t="v.brain" aria-pressed="true"></button>
        <button class="btn" type="button" data-view="mb" data-t="v.mb" aria-pressed="false"></button>
        <button class="btn" type="button" data-view="g5" data-t="v.g5" aria-pressed="false"></button>
      </div>
      <div class="row">
        <button class="btn" type="button" id="tourbtn" data-t="tour.again"></button>
        <button class="btn" type="button" id="qualbtn"></button>
        <button class="btn" type="button" id="langbtn" aria-label="Language"></button>
      </div>
      <details class="layers glass">
        <summary data-t="layers"></summary>
        <div class="chs" id="chs"></div>
      </details>
    </div>
    <div class="legend3d glass" aria-hidden="true">
      <div style="color:var(--kc)"><i></i><span data-t="lg.kc"></span></div>
      <div style="color:var(--da)"><i></i><span data-t="lg.da"></span></div>
      <div style="color:var(--mbon)"><i></i><span data-t="lg.mbon"></span></div>
      <div style="color:#9fb3d9"><i></i><span data-t="lg.shell"></span></div>
      <span class="hint" data-t="lg.hint"></span>
    </div>
  </div>

  <div class="left">
    <div class="title">
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="h1"></h1>
      <p data-t="lede"></p>
    </div>

    <div class="tourcard glass" aria-live="polite">
      <div class="step" id="tour-step"></div>
      <h2 id="tour-title"></h2>
      <p id="tour-body"></p>
      <div class="bar"><i id="tour-bar"></i></div>
      <div class="tour-nav">
        <button class="btn" type="button" id="tour-back" data-t="tour.back"></button>
        <button class="btn primary" type="button" id="tour-next"></button>
        <button class="skip" type="button" id="tour-skip" data-t="tour.skip"></button>
      </div>
    </div>

    <div class="panel glass">
      <div class="mission">
        <span class="lbl" data-t="m.label" style="font:600 13.5px/1.3 var(--body)"></span>
        <div class="chips" id="missions" role="group"></div>
        <div class="status" id="m-status"></div>
      </div>
      <div class="maze">
        <canvas id="maze" aria-label="T-maze: ten flies choose between the smell and fresh air"></canvas>
        <div class="cap" id="maze-cap"></div>
        <div class="fine" data-t="maze.fine"></div>
      </div>
      <div class="readouts small">
        <div class="ro"><b id="r-dw">–</b><span data-t="ro.dw"></span></div>
        <div class="ro"><b id="r-peak">–</b><span data-t="ro.peak"></span></div>
        <div class="ro"><b id="r-brake">–</b><span data-t="ro.brake"></span></div>
      </div>
      <div class="ctl">
        <div class="ctl-top"><label for="onset" data-t="c.onset"></label><output id="o-onset" for="onset"></output></div>
        <input type="range" id="onset" min="-4" max="8" step="0.1" value="0.5">
        <div class="ticks"><span data-t="c.before"></span><span data-t="c.smell"></span><span data-t="c.after"></span></div>
      </div>
      <div class="ctl">
        <div class="ctl-top"><label for="darate" data-t="c.rate"></label><output id="o-darate" for="darate"></output></div>
        <input type="range" id="darate" min="5" max="60" step="1" value="20">
      </div>
      <div class="ctl">
        <span class="lbl" id="drugs-lbl" data-t="c.drug"></span>
        <div class="chips" id="drugs" role="group" aria-labelledby="drugs-lbl"></div>
        <div class="note" id="drug-note"></div>
      </div>
      <div class="row">
        <button class="btn primary" id="play" type="button"></button>
        <button class="btn" id="replay" type="button" data-t="c.replay"></button>
        <span class="row" role="group" id="speeds">
          <button class="chip" type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
          <button class="chip" type="button" data-speed="1" aria-pressed="true">1×</button>
          <button class="chip" type="button" data-speed="2" aria-pressed="false">2×</button>
        </span>
      </div>
    </div>
  </div>

  <div class="timeline glass"><canvas id="tl"></canvas></div>
  <div class="scroll-cue" data-t="cue"></div>
</header>

<main>
<section><div class="wrap">
  <div class="sec-head"><div class="eyebrow" data-t="s0.eb"></div><h2 data-t="s0.h"></h2><p class="muted" data-t="s0.p"></p></div>
  <div class="story">
    <div class="card fact"><b>139,248</b><span data-t="f1"></span></div>
    <div class="card fact"><b>~7,000</b><span data-t="f2"></span></div>
    <div class="card fact"><b>15,091,983</b><span data-t="f3"></span></div>
  </div>
</div></section>

<section><div class="wrap">
  <div class="sec-head"><div class="eyebrow" data-t="s7.eb"></div><h2 data-t="s7.h"></h2></div>
  <div class="detectors">
    <div class="card det"><h3 data-t="r1.h" style="color:var(--kc)"></h3><p data-t="r1.p"></p></div>
    <div class="card det"><h3 data-t="r2.h" style="color:var(--da)"></h3><p data-t="r2.p"></p></div>
    <div class="card det"><h3 data-t="r3.h"></h3><p data-t="r3.p"></p></div>
  </div>
</div></section>

<section id="traces-sec"><div class="wrap">
  <div class="sec-head"><div class="eyebrow" data-t="s1.eb"></div><h2 data-t="s1.h"></h2><p class="muted" data-t="s1.p"></p></div>
  <div class="card traces"><canvas id="traces"></canvas></div>
</div></section>

<section><div class="wrap">
  <div class="pair">
    <div>
      <div class="sec-head"><div class="eyebrow" data-t="s2.eb"></div><h2 data-t="s2.h"></h2><p class="muted" data-t="s2.p"></p></div>
      <div class="card">
        <div class="curve-wrap"><svg id="curve" viewBox="0 0 760 330" role="img"></svg></div>
        <div class="legend">
          <span><i style="background:var(--focus)"></i><span data-t="cl.page"></span></span>
          <span id="lg-control" hidden><i style="background:var(--muted)"></i><span data-t="cl.ctrl"></span></span>
          <span><i style="background:var(--text);height:8px;width:8px;border-radius:50%"></i><span data-t="cl.full"></span></span>
        </div>
      </div>
    </div>
    <div>
      <div class="sec-head"><div class="eyebrow" data-t="s3.eb"></div><h2 data-t="s3.h"></h2><p class="muted" data-t="s3.p"></p></div>
      <div class="card cut"><canvas id="cut"></canvas></div>
    </div>
  </div>
</div></section>

<section><div class="wrap">
  <div class="sec-head"><div class="eyebrow" data-t="s4.eb"></div><h2 data-t="s4.h"></h2><p class="muted" data-t="s4.p"></p></div>
  <div class="detectors">
    <div class="card det">
      <svg viewBox="0 0 300 90" aria-hidden="true">
        <rect x="20" y="22" width="120" height="16" rx="3" fill="#57e08a" opacity=".85"/>
        <rect x="110" y="52" width="150" height="16" rx="3" fill="#ff4fb0" opacity=".85"/>
        <path d="M276 30 L276 62" stroke="#5ab4ff" stroke-width="2"/><path d="M270 56 L276 66 L282 56" fill="none" stroke="#5ab4ff" stroke-width="2"/>
      </svg>
      <h3 data-t="d1.h"></h3><p data-t="d1.p"></p><div class="src">Yovell &amp; Abrams 1992, PNAS 89:6526</div>
    </div>
    <div class="card det">
      <svg viewBox="0 0 300 90" aria-hidden="true">
        <rect x="20" y="22" width="120" height="16" rx="3" fill="#b58cff" opacity=".85"/>
        <rect x="110" y="52" width="150" height="16" rx="3" fill="#57e08a" opacity=".85"/>
        <path d="M276 62 L276 30" stroke="#ffb84d" stroke-width="2"/><path d="M270 36 L276 26 L282 36" fill="none" stroke="#ffb84d" stroke-width="2"/>
      </svg>
      <h3 data-t="d2.h"></h3><p data-t="d2.p"></p><div class="src">Bezprozvanny et al. 1991, Nature 351:751</div>
    </div>
    <div class="card det">

  { view: () => [G.A.pedR.clone().lerp(G.A.g5R, 0.55), 220], az: -1.05, el: 0.25, t: 0.0, speed: 0.4, tags: [["mbonR", "tag.mbon"], ["g5R", "tag.g5"]] },

  { view: () => [G.A.g5R, 95], az: 0.25, el: 0.3, t: 2.6, speed: 0.3, tags: [["mbonR", "tag.mbon"]] },
  { view: () => [G.A.mb, 470], az: -0.4, el: 0.28, t: -1.5, speed: 1, tags: [], last: true },
];
const STEP_MS = 12000;
const tour = {
  i: 0, on: true, t0: 0, paused: false,
  start() { resetParams(); this.on = true; $("stage").classList.add("touring"); this.go(0); },
  go(i) {
    this.i = Math.max(0, Math.min(STEPS.length - 1, i)); this.t0 = performance.now(); this.paused = false;
    const st = STEPS[this.i], words = T("steps")[this.i];
    $("tour-step").textContent = `${this.i + 1} / ${STEPS.length}`;
    $("tour-title").textContent = words[0]; $("tour-body").textContent = words[1];
    $("tour-next").textContent = T(st.last ? "tour.try" : "tour.next");
    $("tour-back").disabled = this.i === 0;
    if (G.ok) {
      const [to, dist] = st.view(); G.flyTo(to, dist, G.dirFrom(st.az, st.el), this.i === 0 ? 3200 : 2400);
      G.setStepTags(st.tags);
      if (G.controls) { G.controls.autoRotate = !!st.rotate && !reduceMotion; }
    }
    state.t = st.t; state.speed = st.speed; setPlaying(true);
  },
  next() { if (STEPS[this.i].last) this.end(); else this.go(this.i + 1); },
  end() {
    this.on = false; $("stage").classList.remove("touring"); state.speed = 1; state.mission = "avoid"; state.tries = 0; buildMissions(); renderReadouts(); state.t = restartAt(); setPlaying(true);
    if (G.ok) { G.setStepTags([]); if (G.controls) G.controls.autoRotate = false; }
  },
  userMoved() { if (this.on) this.paused = true; if (G.controls) G.controls.autoRotate = false; },
  tick(now) {
    if (!this.on) return;
    const f = this.paused || reduceMotion ? 0 : (now - this.t0) / STEP_MS;
    $("tour-bar").style.width = (this.paused || reduceMotion ? 0 : Math.min(100, f * 100)) + "%";
    if (f >= 1) { if (STEPS[this.i].last) this.t0 = now; else this.next(); }
  },
};
$("tour-next").addEventListener("click", () => tour.next());
$("tour-back").addEventListener("click", () => tour.go(tour.i - 1));
$("tour-skip").addEventListener("click", () => tour.end());
$("tourbtn").addEventListener("click", () => tour.start());
document.querySelector(".tourcard").addEventListener("pointerenter", () => { tour.paused = true; });

/* ================================================================ language */
function listInto(id, items) { $(id).replaceChildren(...items.map((x) => { const li = document.createElement("li"); li.textContent = x; return li; })); }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T(el.dataset.t); });
  $("langbtn").textContent = lang === "ru" ? "EN" : "RU";
  $("qualbtn").textContent = T(quality === "eco" ? "q.eco" : "q.high");
  listInto("real-list", T("real")); listInto("drawn-list", T("drawn"));
  buildDrugChips(); buildMissions(); renderReadouts(); setPlaying(state.playing);
  if (G.ok) G.buildChannels();
  if (tour.on) { const words = T("steps")[tour.i]; $("tour-title").textContent = words[0]; $("tour-body").textContent = words[1];
    $("tour-next").textContent = T(STEPS[tour.i].last ? "tour.try" : "tour.next"); if (G.ok) G.setStepTags(STEPS[tour.i].tags); }
  drawCurve();
}
$("qualbtn").addEventListener("click", () => {
  quality = quality === "eco" ? "high" : "eco";
  try { localStorage.setItem("quality", quality); } catch (e) { /* storage unavailable: keep the choice for this visit */ }
  $("qualbtn").textContent = T(quality === "eco" ? "q.eco" : "q.high");
  if (G.resize) G.resize();
});
$("langbtn").addEventListener("click", () => {
  lang = lang === "ru" ? "en" : "ru";
  try { localStorage.setItem("lang", lang); } catch (e) { /* storage unavailable: keep the choice for this visit */ }
  applyLang();
});

/* ================================================================ loop */
let last = performance.now(), stageVisible = true, belowVisible = true;
if ("IntersectionObserver" in window) {
  const seen = new Set(["stage"]);
  const io = new IntersectionObserver((es) => {
    es.forEach((e) => (e.isIntersecting ? seen.add(e.target.id) : seen.delete(e.target.id)));
    stageVisible = seen.has("stage"); belowVisible = seen.has("traces") || seen.has("cut");
  }, { rootMargin: "100px" });
  ["stage", "traces", "cut"].forEach((id) => io.observe($(id)));
}
let lastDraw = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - lastDraw < 1000 / QUALITY[quality].fps - 2) return;
  lastDraw = now;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (state.playing && state.run) { state.t += dt * state.speed; if (state.t > VIEW1) state.t = tour.on ? STEPS[tour.i].t : restartAt(); }
  tour.tick(now);
  if (stageVisible) { drawTimeline(); if (!tour.on) drawMaze(now); if (G.ok) G.frame(now); }
  if (belowVisible) { drawTraces(); drawCut(); }
}
recompute(); recomputeCurve(); initBrain(); applyLang(); tour.start();
if (reduceMotion) { setPlaying(false); state.t = 3; }
requestAnimationFrame(loop);
addEventListener("resize", drawCurve);
})();
</script>
